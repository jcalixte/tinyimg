when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]

engine: "nixery"

dependencies:
  nixpkgs:
    - gleam
    - erlang_28
    - rebar3

steps:
  - name: "Download deps"
    command: "gleam deps download"
  - name: "Test"
    command: "gleam test"
  - name: "Format check"
    command: "gleam format --check src test"
